<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Тебе письмо 💌</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Тебе письмо 💌">
<meta property="og:description" content="Открой конверт">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#1c0f0a">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{min-height:100vh;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:radial-gradient(circle at 30% 15%,#5a2a14 0%,#1c0f0a 55%,#0d0806 100%);color:#f5e9dc;display:flex;align-items:center;justify-content:center;overflow-x:hidden;padding:24px 16px}
.stage{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}
.env{position:relative;width:min(88vw,340px);height:calc(min(88vw,340px)*0.66);cursor:pointer;perspective:1200px;margin-top:40px;transition:transform .8s cubic-bezier(.6,0,.3,1),margin .8s;animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.env .back{position:absolute;inset:0;background:linear-gradient(160deg,#8a4a24,#5e2f16);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.env .front{position:absolute;inset:0;border-radius:14px;z-index:3;pointer-events:none;background:#a15a2c;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env .bottom{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:14px;background:linear-gradient(#c06f3b,#a85a2a);clip-path:polygon(0 100%,50% 48%,100% 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:60%;z-index:5;transform-origin:top center;transition:transform .7s cubic-bezier(.5,0,.3,1),z-index 0s .35s;
 background:linear-gradient(#d08a52,#b8693a);clip-path:polygon(0 0,100% 0,50% 100%);
 filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.seal{position:absolute;left:50%;top:60%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;z-index:6;
 background:radial-gradient(circle at 35% 30%,#f2b06a,#e8984a 45%,#a8561f);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 -3px 6px rgba(0,0,0,.25);transition:opacity .3s,transform .3s}
.letter{position:absolute;left:6%;right:6%;top:8%;height:84%;z-index:2;border-radius:10px;background:linear-gradient(#2a160d,#1c0f0a);border:1px solid rgba(232,152,74,.4);transition:transform .8s cubic-bezier(.5,0,.3,1) .45s,opacity .4s 1s;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;color:#e8984a;letter-spacing:4px;font-size:11px;text-transform:uppercase}
.hint{margin-top:34px;font-size:17px;color:#e8c39a;letter-spacing:.3px;animation:pulse 1.8s ease-in-out infinite;transition:opacity .3s}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.open .env{animation:none;transition:opacity .4s,transform .4s}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .seal{opacity:0;transform:scale(.4)}
.open .letter{transform:translateY(-70%)}
.open .hint{opacity:0;pointer-events:none}
.card{width:100%;max-width:380px;padding:34px 26px 28px;border:1.5px solid rgba(232,152,74,.45);border-radius:28px;background:rgba(0,0,0,.38);box-shadow:0 30px 80px rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
 opacity:0;transform:translateY(40px) scale(.96);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1);display:none}
.card.show{opacity:1;transform:none}
.env.gone{opacity:0;transform:scale(.9)}
.k{letter-spacing:5px;font-size:13px;color:#e8984a;text-transform:uppercase}
h1{font-size:64px;line-height:1;margin:10px 0 4px;letter-spacing:6px;color:#fff;font-weight:900}
.s{font-size:18px;color:#e8984a}
.l{width:60px;height:3px;background:#e8984a;margin:22px 0;border-radius:2px}
.r{font-size:16px;margin:14px 0;line-height:1.45;display:flex;gap:10px}
.r i{font-style:normal;flex:none}
.r b{color:#fff}
.btn{display:block;margin-top:26px;text-align:center;text-decoration:none;font-weight:700;font-size:17px;color:#1c0f0a;background:linear-gradient(135deg,#f2b06a,#e8984a 55%,#c9772f);padding:17px 18px;border-radius:16px;box-shadow:0 10px 26px rgba(232,152,74,.35);transition:transform .15s}
.btn:active{transform:scale(.97)}
</style></head>
<body>
<div class="stage" id="stage">
  <div class="env" id="env" role="button" tabindex="0" aria-label="Открыть конверт">
    <div class="back"></div>
    <div class="letter">Frank</div>
    <div class="front"></div>
    <div class="bottom"></div>
    <div class="flap"></div>
    <div class="seal">❤</div>
  </div>
  <div class="hint" id="hint">Нажми, чтобы открыть 💌</div>
  <div class="card" id="card">
    <div class="k">Жду тебя здесь</div>
    <h1>FRANK</h1>
    <div class="s">ресторан · рёберная</div>
    <div class="l"></div>
    <div class="r"><i>📍</i><span><b>Большой пр. Петроградской стороны, 35</b><br>1 этаж, рядом с кинотеатром «Мираж»</span></div>
    <div class="r"><i>🚇</i><span>м. «Чкаловская» / «Петроградская», ~10 минут пешком</span></div>
    <div class="r"><i>🍖</i><span>Рёбрышки с угольной печи, уютный зал с кирпичом и окнами в пол</span></div>
    <a class="btn" href="https://yandex.ru/maps/org/frank/1741721074/" target="_blank" rel="noopener">Открыть на Яндекс Картах</a>
  </div>
</div>
<script>
(function(){
  var st=document.getElementById('stage'),env=document.getElementById('env'),card=document.getElementById('card'),done=false;
  function open(){
    if(done)return;done=true;
    st.classList.add('open');
    setTimeout(function(){env.classList.add('gone');},1250);
    setTimeout(function(){
      env.style.display='none';document.getElementById('hint').style.display='none';
      card.style.display='block';card.getBoundingClientRect();card.classList.add('show');
    },1650);
  }
  env.addEventListener('click',open);
  env.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')open();});
})();
</script>
</body></html>
